name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install faker==25.8.0
      - name: Vérifier le générateur
        run: python ingestion/generators/generate_flights.py --days 1 --vols-par-jour 10
